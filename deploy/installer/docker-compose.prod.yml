# ═══════════════════════════════════════════════════════════════════════
# Apple Supermarket POS & ERP System — Production Docker Compose
# ═══════════════════════════════════════════════════════════════════════
# Version: 1.0.0
#
# SECURITY POLICY:
#   Only the containerised Nginx binds to the host (127.0.0.1:8000).
#   All other services communicate exclusively over the internal Docker
#   network. Public access (ports 80/443) is handled by the HOST-level
#   Nginx reverse proxy with TLS termination.
#
# PROFILES:
#   monitoring  — Prometheus + Grafana  (default: enabled)
#   ai          — Ollama LLM engine     (default: disabled)
#
# Start with monitoring:   docker compose --profile monitoring up -d
# Start without monitoring: docker compose up -d
# Enable AI later:          docker compose --profile ai up -d ollama
# ═══════════════════════════════════════════════════════════════════════

networks:
  pos_internal:
    driver: bridge
    internal: true   # No outbound internet from containers
  pos_egress:
    driver: bridge   # For services that need to pull models / send email

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────
  postgres:
    # TODO: pin digest after verifying with: docker pull postgres:16.4-alpine && docker inspect --format='{{index .RepoDigests 0}}' postgres:16.4-alpine
    image: postgres:16.4-alpine
    container_name: apple-pos-postgres
    environment:
      POSTGRES_USER: posadmin
      POSTGRES_PASSWORD: ${POSADMIN_PASSWORD:?POSADMIN_PASSWORD must be set}
      POSTGRES_DB: posdb_live
      TZ: ${SYSTEM_TIMEZONE:-Asia/Kolkata}
      PGTZ: ${SYSTEM_TIMEZONE:-Asia/Kolkata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${INSTALL_DIR:-.}/deploy/db:/docker-entrypoint-initdb.d:ro
    networks:
      - pos_internal
    # NO host port binding — internal only
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posadmin -d posdb_live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g

  # ── PgBouncer Connection Pooler ──────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.23.0
    container_name: apple-pos-pgbouncer
    environment:
      DATABASE_URLS: "postgres://posadmin:${POSADMIN_PASSWORD}@postgres:5432/posdb_live"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      SERVER_IDLE_TIMEOUT: 60
    networks:
      - pos_internal
    # NO host port binding — internal only
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U posadmin"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Redis 7 Cache ────────────────────────────────────────────────────
  redis:
    image: redis:7.2.6-alpine
    container_name: apple-pos-redis
    command: >-
      redis-server
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --protected-mode yes
        --bind 0.0.0.0
    # bind 0.0.0.0 inside the container is safe — the network is internal-only
    volumes:
      - redis_data:/data
    networks:
      - pos_internal
    # NO host port binding — internal only
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768m

  # ── .NET 8 Backend API ───────────────────────────────────────────────
  pos_backend:
    build:
      context: ${INSTALL_DIR:-.}/src/Backend
      dockerfile: backend.Dockerfile
    image: apple-pos-backend:${PRODUCT_VERSION:-1.0.0}
    container_name: apple-pos-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SystemConfig__DeploymentMode: SelfHosted
      # Database connections — routed through PgBouncer
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=5432;Database=posdb_live;Username=posadmin;Password=${POSADMIN_PASSWORD};Pooling=true;"
      ConnectionStrings__LiveConnection: "Host=pgbouncer;Port=5432;Database=posdb_live;Username=posadmin;Password=${POSADMIN_PASSWORD};Pooling=true;"
      ConnectionStrings__UatConnection: "Host=pgbouncer;Port=5432;Database=posdb_live;Username=posadmin;Password=${POSADMIN_PASSWORD};Pooling=true;"
      # Persist operation_mode.json across restarts
      SYSTEM_CONFIG_DIR: /app/config
      Redis__ConnectionString: "redis:6379,abortConnect=false"
      JWT__Secret: "${JWT_SECRET:?JWT_SECRET must be set}"
      SystemConfig__AdminPassword: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      SystemConfig__AdminPin: "${ADMIN_PIN}"
      SystemConfig__CashierPassword: "${CASHIER_PASSWORD}"
      # Email — empty values disable email features gracefully
      EmailSettings__SmtpServer: "${SMTP_HOST:-}"
      EmailSettings__SmtpPort: "${SMTP_PORT:-587}"
      EmailSettings__SenderEmail: "${SMTP_FROM:-}"
      EmailSettings__SenderPassword: "${SMTP_PASSWORD:-}"
      EmailSettings__RecipientEmail: "${ADMIN_EMAIL:-}"
      TZ: ${SYSTEM_TIMEZONE:-Asia/Kolkata}
    volumes:
      - ${DATA_DIR:-/var/lib/apple-pos}/config:/app/config
    networks:
      - pos_internal
      - pos_egress    # Needs egress for email sending
    # NO host port binding — internal only
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  # ── React Frontend (served by internal Nginx) ───────────────────────
  pos_frontend:
    build:
      context: ${INSTALL_DIR:-.}/src/Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""   # Empty = same-origin; frontend calls /api/* via the proxy
    image: apple-pos-frontend:${PRODUCT_VERSION:-1.0.0}
    container_name: apple-pos-frontend
    networks:
      - pos_internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # ── Internal Nginx Reverse Proxy ─────────────────────────────────────
  # Routes: / → frontend, /api/ → backend, /health → backend health
  # Exposed ONLY on 127.0.0.1:8000 for the host Nginx to proxy.
  nginx:
    image: nginx:1.27.2-alpine
    container_name: apple-pos-nginx
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ${INSTALL_DIR:-.}/deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${INSTALL_DIR:-.}/deploy/nginx/html:/usr/share/nginx/html:ro
    networks:
      - pos_internal
    restart: unless-stopped
    depends_on:
      - pos_backend
      - pos_frontend
    deploy:
      resources:
        limits:
          memory: 64m

  # ── Prometheus (Monitoring — Optional) ───────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: apple-pos-prometheus
    profiles: ["monitoring"]
    volumes:
      - ${INSTALL_DIR:-.}/infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - pos_internal
    # NO host port binding — access via SSH tunnel only
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Grafana (Monitoring — Optional) ──────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: apple-pos-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}"
      GF_SECURITY_ADMIN_USER: admin
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - pos_internal
    # NO host port binding — access via SSH tunnel only
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Ollama AI Engine (AI — Optional) ─────────────────────────────────
  ollama:
    image: ollama/ollama:0.3.12
    container_name: apple-pos-ollama
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - pos_internal
      - pos_egress    # Needs egress to pull models
    # NO host port binding — internal only
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  postgres_data:
    name: apple-pos-postgres-data
  redis_data:
    name: apple-pos-redis-data
  prometheus_data:
    name: apple-pos-prometheus-data
  grafana_data:
    name: apple-pos-grafana-data
  ollama_data:
    name: apple-pos-ollama-data
