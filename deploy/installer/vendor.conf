# ═══════════════════════════════════════════════════════════════════════
# Apple Supermarket POS & ERP System — Vendor / White-Label Configuration
# ═══════════════════════════════════════════════════════════════════════
#
# ██  IMPORTANT: PLACEHOLDER VALUES  ██
#
# Every value in this file is a PLACEHOLDER intended for the Unnamed
# Technologies demo identity. You MUST replace ALL values with the
# actual vendor/reseller identity BEFORE shipping to any customer.
#
# After editing, run:
#     bash brand.sh
#
# This regenerates INSTALLATION_GUIDE.md and README.md with your
# brand identity. brand.sh will FAIL if any {{TOKEN}} remains
# unsubstituted, so a half-branded document can never reach a customer.
#
# The product slug (apple-pos) is deliberately vendor-independent.
# Rebranding changes the display name, docs, and support contact —
# it does NOT change install paths, service names, or systemd units.
# ═══════════════════════════════════════════════════════════════════════

# ── Vendor Identity ──────────────────────────────────────────────────
VENDOR_COMPANY=" Unnamed Technologies Pvt. Ltd."
VENDOR_SUPPORT_EMAIL="support@unnamedtech.example.com"
VENDOR_SUPPORT_PHONE="+91-44-4000-1234"
VENDOR_WEBSITE="https://www.unnamedtech.example.com"
VENDOR_ADDRESS="No. 12, Anna Salai, Chennai, Tamil Nadu 600002, India"
VENDOR_COPYRIGHT_YEAR="2026"
VENDOR_SUPPORT_HOURS="Mon-Sat, 09:00-18:00 IST"
VENDOR_SLA="First response within 1 business day; critical issues within 4 business hours."
VENDOR_CLASSIFICATION="Confidential — for licensed customers only"

# ── Product Identity ─────────────────────────────────────────────────
PRODUCT_NAME="Apple Supermarket POS & ERP System"
PRODUCT_VERSION="1.0.0"
PRODUCT_SLUG="apple-pos"

# ── Source Repository ────────────────────────────────────────────────
# Used by install.sh to fetch the application code.
# Set RELEASE_TAG to a git tag (e.g., v1.0.0). If the tag doesn't
# exist, install.sh will abort — it never installs from HEAD.
REPO_URL="https://github.com/jegadishmca-dotcom/AI_POWERED_POS_AND_ERP_SYSTEM.git"
RELEASE_TAG="v1.0.0"
