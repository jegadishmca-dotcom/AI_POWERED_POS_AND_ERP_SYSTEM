
networks:
  pos_network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: pos_postgres
    environment:
      POSTGRES_USER: posadmin
      POSTGRES_PASSWORD: pospassword
      POSTGRES_DB: posdb_live
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/db:/docker-entrypoint-initdb.d
    networks:
      - pos_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posadmin -d posdb_live"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pos_pgbouncer
    environment:
      DB_USER: posadmin
      DB_PASSWORD: pospassword
      DB_HOST: postgres
      DB_NAME: posdb_live
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      SERVER_IDLE_TIMEOUT: 60
    ports:
      - "6432:5432"
    networks:
      - pos_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U posadmin"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: pos_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pos_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: pos_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - pos_network
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       # Enable GPU if available
    #       # devices:
    #       #   - driver: nvidia
    #       #     count: 1
    #       #     capabilities: [gpu]

  pos_backend:
    build:
      context: ./src/Backend
      dockerfile: backend.Dockerfile
    container_name: pos_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - SystemConfig__DeploymentMode=SelfHosted
      # DefaultConnection is used for migrations, Hangfire, and system startup
      - ConnectionStrings__DefaultConnection=Host=pgbouncer;Port=5432;Database=posdb_live;Username=posadmin;Password=pospassword;Pooling=true;
      # LiveConnection and UatConnection MUST be explicit — do NOT let ConnectionStringProvider
      # derive them by appending _live/_uat suffixes. LIVE = posdb_live, UAT = posdb_uat (created on demand).
      - ConnectionStrings__LiveConnection=Host=pgbouncer;Port=5432;Database=posdb_live;Username=posadmin;Password=pospassword;Pooling=true;
      - ConnectionStrings__UatConnection=Host=postgres;Port=5432;Database=posdb_uat;Username=posadmin;Password=pospassword;Pooling=true;
      # Persist operation_mode.json (LIVE/UAT state + token_version) across container restarts
      - SYSTEM_CONFIG_DIR=/app/config
      - Redis__ConnectionString=pos_redis:6379,abortConnect=false
      - JWT__Secret=UatDeploymentSecretKey_ReplaceInRealProduction_MinLength64Chars1234567890ABCD
      - EmailSettings__SmtpServer=smtp.gmail.com
      - EmailSettings__SmtpPort=587
      - EmailSettings__SenderEmail=fortabletuse999@gmail.com
      - EmailSettings__SenderPassword=brtb rhbq voqh xhyg
      - EmailSettings__RecipientEmail=jegadishmca@gmail.com
    volumes:
      - pos_config:/app/config
    ports:
      - "5000:8080"
    networks:
      - pos_network
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped


  pos_frontend:
    build:
      context: ./src/Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    container_name: pos_frontend
    ports:
      - "5173:80"
    networks:
      - pos_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pos_nginx
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/html:/usr/share/nginx/html:ro
    networks:
      - pos_network
    restart: unless-stopped
    depends_on:
      - pos_backend
      - pos_frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: pos_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - pos_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pos_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-posadmin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - pos_network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  pos_config:
